version: '1'
connection: production
options:
  chunk_size: 1000
  enforce_column_types: false
  drop_unknown_tables: false
  drop_extra_columns: false
  disable_foreign_key_checks: true
  faker_locale: en_US
tables:
  author_types:
    rows:
      strategy: full
      clear: delete
    columns:
      id:
        strategy: remapping
        arguments:
          - { use: random_integer }
          - { foreign_keys: [{ table: contributors, column: author_type_id, self_referential: false }] }
      name:
        strategy: fake
        faker_method: name
        faker_arguments: []
  cache:
    rows:
      strategy: full
      clear: delete
  cache_locks:
    rows:
      strategy: full
      clear: delete
