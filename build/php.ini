; Réglages de PHP embarqués dans le binaire d'opendb, lus par le serveur web comme par la console.
; Le cache d'OPcache de la console n'est pas ici : un dossier absent arrêterait PHP. Le lanceur (build/launcher/opendb)
; le règle dans ~/.opendb/php/opendb.ini, une fois le dossier créé.

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Les fichiers joints au chat et les imports de bases, jusqu'aux 256 Mo qu'acceptent les imports (max:262144).
upload_max_filesize = 256M
post_max_size = 256M

; Un import lit tout son fichier en mémoire, puis le décompresse et le découpe en requêtes.
memory_limit = 1G

expose_php = Off
display_errors = Off
log_errors = On
