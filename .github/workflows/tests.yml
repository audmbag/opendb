name: tests

on:
  push:
    branches:
      - main
  pull_request:
  # Le workflow de publication les lance avant de construire une version.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite, sqlite3, zip, sodium, pcntl
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install front dependencies
        run: bun install --frozen-lockfile

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Les pages rendues par les tests demandent le manifeste de Vite.
      - name: Build the front
        run: bun run build

      - name: Tests
        run: vendor/bin/pest --parallel
