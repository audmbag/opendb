name: tests

on:
  push:
    branches:
      - main
  pull_request:
  # Le workflow de publication les lance avant de construire une version.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite, sqlite3, zip, sodium, pcntl
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Sans .env, l'application se croit installée et refuse les commandes de Laravel, dont package:discover.
      - name: Install PHP dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate

      - name: Install front dependencies
        run: bun install --frozen-lockfile

      # Les pages rendues par les tests demandent le manifeste de Vite.
      - name: Build the front
        run: bun run build

      - name: Tests
        run: vendor/bin/pest --parallel
