name: release-please

# À chaque push sur main, release-please tient à jour une pull request « chore: release » : la prochaine version, déduite
# des messages de commit (feat: → mineure, fix: → corrective, feat!: → majeure), le fichier VERSION et CHANGELOG.md.
# La fusionner crée le tag et la release, puis les binaires sont construits et ajoutés à la release.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Un tag créé avec le jeton de GitHub Actions ne lance pas d'autre workflow : la construction est appelée ici.
  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.tag }}
