name: lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite, sqlite3, zip, sodium
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Sans .env, l'application se croit installée et refuse les commandes de Laravel, dont package:discover.
      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
          bun install --frozen-lockfile

      - name: Pint
        run: vendor/bin/pint --test

      # Les routes de Wayfinder et les traductions qu'importe le code TypeScript sont générées par le build.
      - name: Generate the routes and the translations
        run: bun run build

      - name: TypeScript
        run: bun run types:check

      - name: ESLint
        run: bun run lint:check

      # Une grande partie du code n'est pas encore passée par Prettier : seuls les fichiers que la pull request change
      # doivent l'être, pour que le format s'étende à mesure que le code évolue.
      - name: Prettier (fichiers changés)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- 'resources/**' | grep -E '\.(ts|tsx|css|json)$' || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs bunx prettier --check --ignore-unknown
          fi
